[project]
name = "paisatrack-backend"
version = "1.0.0"
description = "Backend API for PaisaTrack personal finance management platform"
authors = [
    {name = "PaisaTrack Team", email = "team@paisatrack.com"}
]
dependencies = [
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "fastapi[standard]>=0.119.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "pymysql>=1.1.0",
    "google-genai>=1.57.0",
    "aiomysql>=0.3.2",
    "passlib[bcrypt]>=1.7.4",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

